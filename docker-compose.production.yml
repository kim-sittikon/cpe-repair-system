# =====================================================
# 🐳 Docker Compose — Production
# =====================================================
# วิธีใช้:
#   1. cp .env.production.example .env
#   2. แก้ค่าใน .env ตามคำอธิบาย
#   3. docker compose -f docker-compose.production.yml up -d --build
#   4. เปิดเว็บ http://localhost
#
# หยุดระบบ:
#   docker compose -f docker-compose.production.yml down
#
# ดู logs:
#   docker compose -f docker-compose.production.yml logs -f app
# =====================================================

services:
  # ============================================
  # 🚀 Laravel Application (PHP-FPM + Nginx + Queue Worker)
  # ============================================
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    image: cpe-repair-system:production
    container_name: cpe-repair-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    volumes:
      # เก็บไฟล์อัปโหลดไว้นอก container (ไม่หายตอน rebuild)
      - app-storage:/var/www/html/storage/app/public
      # เก็บ logs ไว้นอก container
      - app-logs:/var/www/html/storage/logs
      # Firebase credentials (ถ้ามี — ถ้าไม่มีไฟล์ ลบบรรทัดนี้ได้)
      - ./firebase-credentials.json:/var/www/html/storage/app/firebase-credentials.json:ro
    networks:
      - cpe-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================
  # 🗄️ MySQL Database
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: cpe-repair-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-cpe_repair}"
      MYSQL_USER: "${DB_USERNAME:-cpe_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - cpe-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================
  # ⚡ Redis (Cache / Session / Queue)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: cpe-repair-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - cpe-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

# ============================================
# 🔗 Networks & Volumes
# ============================================
networks:
  cpe-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  app-logs:
    driver: local
