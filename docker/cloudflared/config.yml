# Cloudflare Tunnel Configuration
# Best Practice: ใช้ Docker service name แทน IP
# ไฟล์นี้จะถูก mount เข้า cloudflared container

tunnel: cperepair-local
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Main application - ใช้ Docker service name
  - hostname: cperepair.app
    service: http://laravel.test:80
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      
  # Catch-all rule (required)
  - service: http_status:404
