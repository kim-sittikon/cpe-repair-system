# =====================================================
# Docker Compose Override for Local Development
# =====================================================
# ไฟล์นี้ merge กับ compose.yaml อัตโนมัติ
# ตั้ง restart policy ให้ทุก service
# =====================================================

services:
  laravel.test:
    restart: unless-stopped

  queue-worker:
    restart: unless-stopped

  mysql:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  mailpit:
    restart: unless-stopped
