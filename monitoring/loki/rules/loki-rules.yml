# Loki Alert Rules for CPE Repair System
# Phase 3 - Log-based Alerts with Rate Limiting

groups:
  # =============================================================
  # LARAVEL LOG ALERTS (team: backend)
  # =============================================================
  - name: laravel-logs
    interval: 1m
    rules:
      # Laravel Error Rate - alert ถ้า error > 5 ต่อนาที
      - alert: LaravelHighErrorRate
        expr: |
          sum(count_over_time({service="laravel"} |~ "(?i)\\[error\\]|Exception|Fatal" [1m])) > 5
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "🟡 High Laravel error rate"
          description: "More than 5 errors per minute in Laravel logs."
          recovery: "Error rate is back to normal"

      # Laravel Critical Error - specific patterns
      - alert: LaravelCriticalError
        expr: |
          sum(count_over_time({service="laravel"} |~ "(?i)SQLSTATE|PDOException|QueryException|Deadlock" [5m])) > 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "🔴 Laravel critical database error"
          description: "Database error detected in Laravel logs."
          recovery: "Database errors resolved"

  # =============================================================
  # MYSQL LOG ALERTS (team: backend)
  # =============================================================
  - name: mysql-logs
    interval: 1m
    rules:
      # MySQL Deadlock
      - alert: MySQLDeadlock
        expr: |
          sum(count_over_time({service="mysql"} |~ "(?i)Deadlock found" [5m])) > 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "🔴 MySQL Deadlock detected"
          description: "Deadlock found in MySQL logs. Check queries."
          recovery: "No more deadlocks"

      # MySQL Too Many Connections
      - alert: MySQLTooManyConnections
        expr: |
          sum(count_over_time({service="mysql"} |~ "(?i)Too many connections" [5m])) > 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "🔴 MySQL Too Many Connections"
          description: "MySQL has reached connection limit."
          recovery: "Connection count is normal"

      # MySQL Slow Query (optional - อาจ noise)
      - alert: MySQLSlowQueries
        expr: |
          sum(count_over_time({service="mysql"} |~ "(?i)slow query|Query_time: [5-9]\\." [5m])) > 10
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "🟡 High number of slow queries"
          description: "More than 10 slow queries in 5 minutes."
          recovery: "Slow query rate is normal"

  # =============================================================
  # AUTHENTICATION ALERTS (team: security)
  # =============================================================
  - name: auth-logs
    interval: 1m
    rules:
      # Auth Brute Force - มาก login attempts > 10/min
      - alert: AuthBruteForce
        expr: |
          sum(count_over_time({service="laravel"} |~ "(?i)Too many login attempts|throttle" [1m])) > 10
        for: 2m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "🔴 Possible brute force attack"
          description: "More than 10 throttled login attempts per minute."
          recovery: "Login attempts rate is normal"

      # Auth Failures - login ผิดบ่อย
      - alert: AuthHighFailureRate
        expr: |
          sum(count_over_time({service="laravel"} |~ "(?i)Invalid credentials|login failed|Unauthorized" [1m])) > 5
        for: 3m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "🟡 High authentication failure rate"
          description: "More than 5 failed login attempts per minute."
          recovery: "Auth failure rate is normal"

  # =============================================================
  # GENERAL ERROR ALERTS (team: infra)
  # =============================================================
  - name: general-logs
    interval: 1m
    rules:
      # Out of Memory
      - alert: OutOfMemoryKill
        expr: |
          sum(count_over_time({job="docker"} |~ "(?i)Out of memory|OOM|Killed process" [5m])) > 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "🔴 OOM Kill detected"
          description: "A process was killed due to out of memory."
          recovery: "No more OOM events"

      # Disk Full Warning from logs
      - alert: DiskFullFromLogs
        expr: |
          sum(count_over_time({job="docker"} |~ "(?i)No space left on device|disk full" [5m])) > 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "🔴 Disk Full detected in logs"
          description: "A service reported disk full error."
          recovery: "Disk space is available"
