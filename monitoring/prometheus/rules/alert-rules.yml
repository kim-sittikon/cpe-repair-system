# Prometheus Alert Rules for CPE Repair System
# Phase 3 - Smart Alerts with Severity + Team Labels

groups:
  # =============================================================
  # INFRASTRUCTURE ALERTS (team: infra)
  # =============================================================
  - name: infrastructure
    rules:
      # Server Down - เครื่องล่ม (ใช้เป็น inhibition source หลัก)
      - alert: ServerDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "🔴 Server is DOWN"
          description: "Node exporter is not responding. Server may be down."
          recovery: "Server is back online"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "🟡 High CPU Usage"
          description: "CPU usage is above 80% for 5 minutes. Current: {{ $value | printf \"%.1f\" }}%"
          recovery: "CPU usage is back to normal"

      # Critical CPU Usage
      - alert: CriticalCPUUsage
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 95
        for: 2m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "🔴 Critical CPU Usage"
          description: "CPU usage is above 95% for 2 minutes. Immediate action required."
          recovery: "CPU usage is back to normal"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "🟡 High Memory Usage"
          description: "Memory usage is above 85%. Current: {{ $value | printf \"%.1f\" }}%"
          recovery: "Memory usage is back to normal"

      # Disk Almost Full
      - alert: DiskAlmostFull
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "🟡 Disk Almost Full"
          description: "Disk usage is above 85%. Current: {{ $value | printf \"%.1f\" }}%"
          recovery: "Disk usage is back to normal"

  # =============================================================
  # APPLICATION ALERTS (team: backend)
  # =============================================================
  - name: application
    rules:
      # Laravel Down
      # DISABLED: laravel-health scrape job returns JSON not Prometheus metrics
      # TODO: Add Blackbox Exporter for proper HTTP probing
      # - alert: LaravelDown
      #   expr: up{job="laravel-health"} == 0
      #   for: 1m
      #   labels:
      #     severity: critical
      #     team: backend
      #   annotations:
      #     summary: "🔴 Laravel Application is DOWN"
      #     description: "Laravel health endpoint is not responding."
      #     recovery: "Laravel is back online"

      # MySQL Down (ถ้ามี MySQL exporter)
      - alert: MySQLDown
        expr: mysql_up == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "🔴 MySQL is DOWN"
          description: "MySQL database is not responding."
          recovery: "MySQL is back online"

      # Redis Down (ถ้ามี Redis exporter)
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "🔴 Redis is DOWN"
          description: "Redis cache is not responding."
          recovery: "Redis is back online"

  # =============================================================
  # SECURITY ALERTS (team: security)
  # =============================================================
  - name: security
    rules:
      # Cloudflare Overwhelmed - Correlated Alert (ฉลาด)
      # Threats สูง + (CPU สูง OR 5xx สูง) = Cloudflare เริ่มเอาไม่อยู่
      - alert: CloudflareOverwhelmed
        expr: |
          cloudflare_zone_threats_total > 100
          and
          (
            (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 60
          )
        for: 3m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "🔴 Cloudflare is being overwhelmed"
          description: "High threats ({{ $value }}) AND high CPU. Attack may be penetrating."
          recovery: "Threat level is back to normal"

      # Cloudflare Protecting - Info (ใช้เป็น inhibition source)
      # Threats สูง + CPU ต่ำ = Cloudflare กันได้
      - alert: CloudflareProtecting
        expr: |
          cloudflare_zone_threats_total > 100
          and
          (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 < 50
        for: 3m
        labels:
          severity: info
          team: security
        annotations:
          summary: "🟢 Cloudflare is protecting - No action needed"
          description: "High threats but low CPU. Cloudflare is blocking effectively."

      # Threats High (Warning) - จะถูก inhibit ถ้า CloudflareProtecting active
      - alert: ThreatsHigh
        expr: cloudflare_zone_threats_total > 150
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "🟡 High number of threats detected"
          description: "Cloudflare is blocking {{ $value }} threats. Monitor closely."
          recovery: "Threat level is back to normal"

  # =============================================================
  # CONTAINER ALERTS (team: infra)
  # =============================================================
  - name: containers
    rules:
      # Container High Memory
      - alert: ContainerHighMemory
        expr: |
          sum(container_memory_usage_bytes{name=~"cpe_repair_system.*"}) by (name) 
          / 1024 / 1024 > 512
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "🟡 Container using high memory"
          description: "Container {{ $labels.name }} is using more than 512MB RAM."
          recovery: "Container memory usage is back to normal"

      # Container Restart
      - alert: ContainerRestarting
        expr: |
          increase(container_last_seen{name=~"cpe_repair_system.*"}[5m]) > 2
        for: 1m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "🟡 Container is restarting frequently"
          description: "Container {{ $labels.name }} has restarted multiple times."
          recovery: "Container is stable"
