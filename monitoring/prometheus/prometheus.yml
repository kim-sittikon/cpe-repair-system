# Prometheus Configuration for CPE Repair System
# Phase 3 - Smart Logging + Alerting

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules files
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (Host metrics: CPU, RAM, Disk)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor (Container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Laravel Health Endpoint
  # DISABLED: /health returns JSON but Prometheus expects metrics format
  # TODO: Add Blackbox Exporter for HTTP probing
  # - job_name: 'laravel-health'
  #   metrics_path: /health
  #   static_configs:
  #     - targets: ['172.25.58.38:80']
  #   scrape_interval: 30s

  # Cloudflare Exporter (WAF/Bot metrics)
  - job_name: 'cloudflare'
    static_configs:
      - targets: ['cloudflare-exporter:9199']
    scrape_interval: 60s

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Loki (optional - for Loki metrics)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
