# Alertmanager Configuration for CPE Repair System
# Phase 3 - Professional Alerting with Inhibition

global:
  resolve_timeout: 5m
  # Webhook จะเพิ่มทีหลัง (Line/Discord/Telegram)
  # slack_api_url: ''
  # http_config:
  #   follow_redirects: true

# Route tree - กำหนดว่า alert ไปไหน
route:
  # Default receiver
  receiver: 'null'
  
  # Group alerts ที่เกี่ยวข้องกัน
  group_by: ['alertname', 'severity', 'team']
  group_wait: 30s      # รอ 30s รวม alerts
  group_interval: 5m   # ส่งซ้ำทุก 5m ถ้ายัง active
  repeat_interval: 4h  # ส่งซ้ำถ้าไม่ได้ resolve ใน 4h
  
  routes:
    # Critical alerts - ต้อง action ทันที
    - receiver: 'critical-alerts'
      match:
        severity: critical
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts - ควรดู แต่ไม่ urgent
    - receiver: 'warning-alerts'
      match:
        severity: warning
      group_wait: 1m
      repeat_interval: 4h

    # Security alerts - ส่งไปทีม security
    - receiver: 'security-alerts'
      match:
        team: security
      group_wait: 10s

# Inhibition rules - ไม่ alert ซ้ำซ้อน
inhibit_rules:
  # ถ้าเครื่องล่ม (ServerDown) → ไม่ต้อง alert CPU/RAM/App
  - source_matchers:
      - alertname = "ServerDown"
    target_matchers:
      - alertname =~ "HighCPU|HighMemory|LaravelDown|MySQLDown"
    equal: ['instance']

  # ถ้า App ล่ม → ไม่ต้อง alert 5xx errors
  - source_matchers:
      - alertname = "LaravelDown"
    target_matchers:
      - alertname = "High5xxRate"

  # ถ้า Cloudflare กันได้ (Threats สูง + CPU ต่ำ) → suppress warning
  - source_matchers:
      - alertname = "CloudflareProtecting"
      - severity = "info"
    target_matchers:
      - alertname = "ThreatsHigh"
      - severity = "warning"

# Receivers - ตอนนี้เป็น null (ไม่ส่งไปไหน)
# จะเพิ่ม webhook ทีหลังเมื่อ rules นิ่งแล้ว
receivers:
  - name: 'null'
    # ไม่ทำอะไร - ดูได้จาก Grafana UI

  - name: 'critical-alerts'
    # TODO: เพิ่ม Line/Discord webhook
    # webhook_configs:
    #   - url: 'https://notify-api.line.me/api/notify'
    #     send_resolved: true

  - name: 'warning-alerts'
    # TODO: เพิ่ม webhook

  - name: 'security-alerts'
    # TODO: เพิ่ม webhook

# Templates for alert messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'
