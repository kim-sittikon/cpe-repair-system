# Promtail Configuration for CPE Repair System
# Phase 3 - Docker API-based Log Collection (WSL2/Docker Desktop compatible)

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker containers via Docker API
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use container name as service label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: container
      - source_labels: ['__meta_docker_container_name']
        regex: '/.*(laravel|mysql|redis|mailpit|cloudflared|prometheus|grafana|loki|promtail|alertmanager|cadvisor|node-exporter|cloudflare-exporter).*'
        target_label: service
      # Add job label
      - action: replace
        target_label: job
        replacement: docker
