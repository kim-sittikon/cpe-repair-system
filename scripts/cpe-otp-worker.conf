[program:cpe-otp-worker]
process_name=%(program_name)s_%(process_num)02d

; 🚀 OTP-specific queue worker - Priority processing
command=php /var/www/cpe-repair-system/artisan queue:work redis --queue=otp-high --sleep=1 --tries=2 --timeout=30 --max-time=3600 --memory=128

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30

user=www-data
numprocs=2

redirect_stderr=true
stdout_logfile=/var/www/cpe-repair-system/storage/logs/otp-worker.log
stdout_logfile_maxbytes=10MB
