services:
    laravel.test:
        restart: always
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - mailpit
        deploy:
            resources:
                limits:
                    memory: 1G
                    cpus: '1.0'
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
    cloudflared:
        restart: always
        image: 'cloudflare/cloudflared:latest'
        command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
        networks:
            - sail
        depends_on:
            - laravel.test
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: '0.25'
        logging:
            driver: json-file
            options:
                max-size: "5m"
                max-file: "2"
    queue-worker:
        restart: always
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        entrypoint: ["php", "/var/www/html/artisan", "queue:work", "--queue=otp-high,default,emails", "--sleep=3", "--tries=3", "--max-time=3600"]
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
            - mysql
            - redis
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: '0.25'
        logging:
            driver: json-file
            options:
                max-size: "5m"
                max-file: "2"
    mysql:
        restart: always
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
        deploy:
            resources:
                limits:
                    memory: 1G
                    cpus: '0.5'
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
    redis:
        restart: always
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: '0.25'
        logging:
            driver: json-file
            options:
                max-size: "5m"
                max-file: "2"
    mailpit:
        restart: always
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: '0.25'
        logging:
            driver: json-file
            options:
                max-size: "5m"
                max-file: "2"
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
